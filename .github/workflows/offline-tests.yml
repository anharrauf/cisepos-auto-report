name: Offline regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python -m unittest discover -v
      - name: Validate discovery PowerShell syntax without execution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PurchaseTokens = $null
          $PurchaseParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'discover_purchase_selectors.ps1'), [ref]$PurchaseTokens, [ref]$PurchaseParseErrors) | Out-Null
          if ($PurchaseParseErrors.Count -gt 0) { throw 'Discovery PowerShell syntax validation failed.' }
